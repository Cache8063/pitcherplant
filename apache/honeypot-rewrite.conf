# WordPress Honeypot Tarpit — Apache Rewrite Rules
#
# Add these rules to your .htaccess BEFORE the WordPress rewrite block.
# Routes /wp-login.php and /wp-admin to the honeypot for unauthenticated visitors.
# Logged-in users with valid WordPress cookies pass through normally.

# BEGIN Honeypot Tarpit
# Block direct access to the config file
<Files "wp-trap-config.php">
    Require all denied
</Files>

<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{HTTP_COOKIE} !wordpress_logged_in_ [NC]
RewriteRule ^wp-login\.php$ /wp-trap.php [L]
RewriteCond %{HTTP_COOKIE} !wordpress_logged_in_ [NC]
RewriteRule ^wp-admin/?$ /wp-trap.php [L]
</IfModule>
# END Honeypot Tarpit
