# Recommended Security Headers for WordPress
#
# Add to .htaccess or Apache site config.
# These are independent of the honeypot but complement it well.

# BEGIN Security Headers
<IfModule mod_headers.c>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; frame-ancestors 'self';"
    Header always set Cross-Origin-Opener-Policy "same-origin"
</IfModule>
# END Security Headers

# BEGIN Disable Directory Browsing
Options -Indexes
# END Disable Directory Browsing
