server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # Block access to config file
    location = /wp-trap-config.php {
        return 403;
    }

    # Honeypot rewrites: route wp-login.php and wp-admin to trap
    # Only if the visitor doesn't have a valid WordPress session cookie
    location = /wp-login.php {
        if ($http_cookie !~* "wordpress_logged_in_") {
            rewrite ^ /wp-trap.php last;
        }
        try_files $uri =404;
    }

    location = /wp-admin {
        if ($http_cookie !~* "wordpress_logged_in_") {
            rewrite ^ /wp-trap.php last;
        }
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
