[wp-honeypot]
enabled  = true
port     = http,https
filter   = wp-honeypot
logpath  = /var/log/wp-honeypot.log
maxretry = 20
findtime = 86400
bantime  = 2592000
# 30-day ban after 20 attempts within 24 hours
# ~7 minutes of tarpit before the door slams
action   = iptables-multiport[name=wp-honeypot, port="http,https", protocol=tcp]
